services:
    grokboard.auth.cli:
        class: grokboard\grok\auth\cli

    grokboard.controller.stream:
        class: grokboard\grok\controller\stream
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@request'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%core.table_prefix%'

    grokboard.controller.auth:
        class: grokboard\grok\controller\auth
        arguments:
            - '@auth'
            - '@request'
            - '@user'
            - '@grokboard.auth.cli'

    grokboard.listener:
        class: grokboard\grok\event\main_listener
        arguments:
            - '@config'
            - '@dbal.conn'
            - '@template'
            - '@user'
            - '@auth'
            - '@controller.helper'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }
